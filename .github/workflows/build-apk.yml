name: Build ShaLo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3   # installs SDK tools and accepts licenses

      - name: Download Node runtime plugin (capacitor-nodejs)
        run: |
          mkdir -p vendor
          curl -fL -o vendor/capacitor-nodejs.tgz https://github.com/hampoelz/Capacitor-NodeJS/releases/download/v1.0.0-beta.10/capacitor-nodejs.tgz

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Install server packages and sync Capacitor
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShaLo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
