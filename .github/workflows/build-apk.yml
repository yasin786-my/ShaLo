name: Build ShaLo APK

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses and install SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Download Node runtime plugin (capacitor-nodejs)
        run: |
          mkdir -p vendor
          curl -fL -o vendor/capacitor-nodejs.tgz https://github.com/hampoelz/Capacitor-NodeJS/releases/download/v1.0.0-beta.10/capacitor-nodejs.tgz

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Install server packages and sync Capacitor
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShaLo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk