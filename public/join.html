<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join ShaLo</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sun:#FFE45E;--pink:#FF3D8B;--blue:#2D5BFF;--ink:#1B1240;--white:#fff;
  --display:"Bagel Fat One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--sun);color:var(--ink);font:400 1.0625rem/1.5 var(--body);padding:20px}
.box{width:min(440px,100%);text-align:center}
h1{margin:0 0 20px;font:400 clamp(3.5rem,18vw,5.5rem)/.9 var(--display);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
h1 .sha{color:var(--pink)} h1 .lo{color:var(--blue)}
.card{background:var(--white);border:3px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:clamp(18px,4vw,28px)}
h2{margin:0 0 6px;font:400 1.75rem/1.1 var(--display)}
p{margin:0 0 16px}
input{width:100%;font:700 2rem/1.2 var(--body);letter-spacing:.4em;text-align:center;padding:10px 8px 10px calc(8px + .4em);border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink)}
input::placeholder{color:rgba(27,18,64,.35)}
.btn{margin-top:16px;width:100%;font:700 1.0625rem var(--body);color:var(--white);background:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--blue)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--blue)}
.msg{min-height:1.5em;margin:12px 0 0;font-weight:700}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
</style>
</head>
<body>
<main class="box">
  <h1><span class="sha">Sha</span><span class="lo">Lo</span></h1>
  <form class="card" id="f">
    <h2>Enter the code</h2>
    <p>On the device running ShaLo, tap <b>Add a device</b> and type the 6-digit code you see.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="6-digit code" autofocus>
    <button class="btn" type="submit">Join</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
</main>
<script>
const input = document.getElementById("code"), msg = document.getElementById("msg");
if (new URLSearchParams(location.search).has("expired")) msg.textContent = "That code expired or was already used. Ask for a fresh one.";
async function join() {
  const code = input.value.replace(/\D/g, "");
  if (code.length !== 6) { msg.textContent = "Type all 6 digits."; return; }
  msg.textContent = "Checking…";
  try {
    const r = await fetch("/api/join", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    if (r.ok) return location.replace("/");
    msg.textContent = (await r.json()).error || "That code didn't work.";
  } catch { msg.textContent = "Can't reach ShaLo. Check your Wi-Fi."; }
  input.select();
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); join(); });
input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(0, 6); if (input.value.length === 6) join(); });
</script>
</body>
</html>
