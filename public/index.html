<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShaLo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFE45E; --pink:#FF3D8B; --blue:#2D5BFF; --ink:#1B1240; --white:#fff;
  --display:"Bagel Fat One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--sun)}
body{margin:0;min-height:100vh;background:var(--sun);color:var(--ink);font:400 1.0625rem/1.5 var(--body);padding:clamp(16px,4vw,40px)}
.wrap{max-width:1080px;margin:0 auto}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:clamp(20px,4vw,36px)}
h1{margin:0;font:400 clamp(3.5rem,13vw,6.25rem)/.9 var(--display);letter-spacing:-.01em;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
h1 .sha{color:var(--pink)} h1 .lo{color:var(--blue)}
.tag{margin:8px 0 0;font-weight:600;max-width:32ch}
.addr{font:700 .95rem var(--body);background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:none}
.addr.on{display:inline-block}
.addr:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

.grid{display:grid;gap:clamp(18px,3vw,32px)}
@media(min-width:880px){.grid{grid-template-columns:5fr 6fr;align-items:start}}
.card{background:var(--white);border:3px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:clamp(18px,3vw,28px)}
h2{margin:0 0 4px;font:400 1.75rem/1.1 var(--display)}

.drop{border-radius:36px 28px 40px 28px;text-align:center;transition:transform .2s,background .2s}
.drop.over{background:var(--pink);transform:rotate(-1.5deg) scale(1.02)}
.drop p{margin:0 auto 18px;max-width:30ch}
.devices{width:100%;max-width:340px;height:auto;display:block;margin:10px auto 14px;overflow:visible}
.packet{fill:var(--sun);stroke:var(--ink);stroke-width:3;animation:hop 1.1s .5s ease-in-out 1 both}
.drop.sending .packet{animation:ride .9s linear infinite}
.drop.receiving .packet{animation:back 1s linear 1 both}
@keyframes back{0%{transform:translateX(92px);opacity:1}85%{opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes hop{0%,100%{transform:translate(0,0)}40%{transform:translate(46px,-26px)}70%{transform:translate(92px,0)}85%{transform:translate(92px,-8px)}}
@keyframes ride{0%{transform:translateX(0);opacity:1}85%{opacity:1}100%{transform:translateX(92px);opacity:0}}

.btn{display:inline-block;font:700 1.0625rem var(--body);color:var(--white);background:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:12px 26px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--blue);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--blue)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--blue)}
.btn.sm{font-size:.95rem;padding:7px 16px;background:var(--blue);box-shadow:3px 3px 0 var(--ink)}
.btn.sm:hover{box-shadow:5px 5px 0 var(--ink)}
.btn.sm:active{box-shadow:1px 1px 0 var(--ink)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.queue{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;text-align:left}
.q{background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.q b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border:2px solid var(--ink);border-radius:99px;background:var(--white);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}
.q.done .bar i{background:var(--pink)}
.q small{font-weight:600}
.q.fail{background:var(--pink)}

.count{margin:0 0 14px;font-weight:600}
.files{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.f{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.ext{flex:none;min-width:54px;text-align:center;font:400 1rem var(--display);border:3px solid var(--ink);border-radius:12px;padding:6px 4px;background:var(--white)}
.ext.img{background:var(--pink)} .ext.av{background:var(--blue);color:var(--white)} .ext.doc{background:var(--sun)}
.meta{flex:1;min-width:0}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{font-weight:600}
.empty{border:3px dashed var(--ink);border-radius:18px;padding:22px;font-weight:600}
.empty strong{display:block;font:400 1.25rem var(--display);margin-bottom:4px}
@media(max-width:480px){.f{flex-wrap:wrap}.f .btn{width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="sha">Sha</span><span class="lo">Lo</span></h1>
      <p class="tag">Send files both ways between any devices on this Wi-Fi.</p>
    </div>
    <button class="addr" id="addr" type="button" title="Copy this address to share it"></button>
  </header>

  <div class="grid">
    <section class="card drop" id="drop" aria-labelledby="dropH">
      <h2 id="dropH">Send a file</h2>
      <svg class="devices" viewBox="0 0 320 142" role="img" aria-label="This device sharing with other devices in both directions">
        <rect x="14" y="14" width="50" height="92" rx="12" fill="#FF3D8B" stroke="#1B1240" stroke-width="3"/>
        <rect x="23" y="26" width="32" height="56" rx="5" fill="#fff" stroke="#1B1240" stroke-width="2"/>
        <rect x="224" y="26" width="84" height="58" rx="8" fill="#2D5BFF" stroke="#1B1240" stroke-width="3"/>
        <rect x="233" y="35" width="66" height="40" rx="4" fill="#fff" stroke="#1B1240" stroke-width="2"/>
        <rect x="210" y="88" width="112" height="12" rx="6" fill="#1B1240"/>
        <path d="M84 60H204" stroke="#1B1240" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>
        <path d="M86 50L76 60l10 10M202 50l10 10-10 10" stroke="#1B1240" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle class="packet" cx="104" cy="60" r="9"/>
        <text x="39" y="130" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B1240">This device</text>
        <text x="266" y="130" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B1240">Other devices</text>
      </svg>
      <p>Drop files anywhere on this card, or pick them from your device.</p>
      <label class="btn" id="pick" tabindex="0" role="button">Send files<input type="file" id="file" multiple></label>
      <ul class="queue" id="queue" aria-live="polite"></ul>
    </section>

    <section class="card" aria-labelledby="listH">
      <h2 id="listH">Shared folder</h2>
      <p class="count" id="count">Checking the shared folder…</p>
      <ul class="files" id="files"></ul>
    </section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// This device's identity, so every file shows who sent it
const me = (() => { try { let i = localStorage.getItem("shalo-id"); if (!i) { i = Math.random().toString(36).slice(2, 10); localStorage.setItem("shalo-id", i); } return i; } catch { return "anon"; } })();
const myName = (() => { const u = navigator.userAgent; return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "iPad" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows PC" : /Mac/.test(u) ? "Mac" : /CrOS/.test(u) ? "Chromebook" : /Linux/.test(u) ? "Linux PC" : "Device"; })();
const drop = $("#drop"), queue = $("#queue"), list = $("#files"), input = $("#file");
let sig = "", active = 0;

const size = b => { if (b < 1024) return b + " B"; const u = ["KB","MB","GB"]; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 2); return b.toFixed(b < 10 ? 1 : 0) + " " + u[i]; };
const ago = t => { const s = (Date.now() - t) / 1000; return s < 45 ? "just now" : s < 3600 ? Math.round(s/60) + " min ago" : s < 86400 ? Math.round(s/3600) + " hr ago" : new Date(t).toLocaleDateString(); };
const kind = e => /^(jpe?g|png|gif|webp|heic|svg)$/.test(e) ? "img" : /^(mp4|mov|mkv|webm|mp3|wav|m4a|aac)$/.test(e) ? "av" : /^(pdf|docx?|xlsx?|pptx?|txt|md|csv)$/.test(e) ? "doc" : "";

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

async function refresh() {
  try {
    const files = await (await fetch("/api/files")).json();
    const next = files.map(f => f.id + f.size).join("|");
    $("#count").textContent = files.length ? files.length + (files.length === 1 ? " file" : " files") + " shared" : "";
    if (next !== sig) {
      sig = next; list.replaceChildren();
      if (!files.length) {
        const e = el("li", "empty"); e.append(el("strong", "", "Nothing here yet"), "Send a file from any device on this Wi-Fi and it shows up here.");
        list.append(e);
      }
      files.forEach(f => {
        const ext = (f.name.split(".").pop() || "").toLowerCase().slice(0, 4);
        const li = el("li", "f"), m = el("div", "meta"), when = el("small", "when", ""), a = el("a", "btn sm", "Download");
        when.dataset.t = f.modified;
        when.dataset.s = size(f.size) + " · " + (f.from ? (f.from.id === me ? "from you" : "from " + f.from.name) : "added on the host device");
        when.textContent = when.dataset.s + " · " + ago(f.modified);
        m.append(el("b", "", f.name), when);
        a.href = f.url; a.addEventListener("click", () => { drop.classList.add("receiving"); setTimeout(() => drop.classList.remove("receiving"), 1100); }); a.setAttribute("aria-label", "Download " + f.name);
        li.append(el("span", "ext " + kind(ext), f.name.includes(".") ? "." + ext : "file"), m, a);
        list.append(li);
      });
    } else {
      document.querySelectorAll(".when").forEach(w => w.textContent = w.dataset.s + " · " + ago(+w.dataset.t));
    }
  } catch { $("#count").textContent = "Can't reach ShaLo. Check that it's still running on the host device."; }
}

function send(file) {
  const q = el("li", "q"), name = el("b", "", file.name), bar = el("div", "bar"), fill = el("i"), st = el("small", "", "Sending…");
  bar.append(fill); q.append(name, bar, st); queue.prepend(q);
  active++; drop.classList.add("sending");
  const fd = new FormData(); fd.append("files", file);
  const x = new XMLHttpRequest(); x.open("POST", "/upload"); x.setRequestHeader("X-Device-Id", me); x.setRequestHeader("X-Device-Name", encodeURIComponent(myName));
  x.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + "%"; };
  const end = () => { if (--active === 0) drop.classList.remove("sending"); };
  x.onload = () => {
    end();
    if (x.status === 200) { fill.style.width = "100%"; q.classList.add("done"); st.textContent = "Sent · " + size(file.size); refresh(); setTimeout(() => q.remove(), 4000); }
    else { let msg = "Upload failed. Try again."; try { msg = JSON.parse(x.responseText).error; } catch {} q.classList.add("fail"); st.textContent = msg; }
  };
  x.onerror = () => { end(); q.classList.add("fail"); st.textContent = "Lost the connection to ShaLo. Try again."; };
  x.send(fd);
}
const sendAll = files => [...files].forEach(send);

input.addEventListener("change", () => { sendAll(input.files); input.value = ""; });
$("#pick").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || !drop.contains(e.relatedTarget)) drop.classList.remove("over"); }));
drop.addEventListener("drop", e => sendAll(e.dataTransfer.files));
["dragover","drop"].forEach(t => window.addEventListener(t, e => e.preventDefault()));

fetch("/api/info").then(r => r.json()).then(({ urls }) => {
  if (!urls.length) return;
  const b = $("#addr"); b.textContent = "Join from another device: " + urls[0].replace("http://", ""); b.classList.add("on");
  b.onclick = () => navigator.clipboard && navigator.clipboard.writeText(urls[0]).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Join from another device: " + urls[0].replace("http://", ""), 1500); });
}).catch(() => {});

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 4000);
</script>
</body>
</html>
